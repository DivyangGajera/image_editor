name: Flutter CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 2. Setup Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Run flutter pub get
        run: flutter pub get

      - name: 4. Run build_runner build
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 5. Run flutter analyze
        run: flutter analyze --fatal-infos

      - name: 6. Run flutter test with coverage
        run: flutter test --coverage

      - name: 7. Build Android APK (release)
        run: flutter build apk --release
